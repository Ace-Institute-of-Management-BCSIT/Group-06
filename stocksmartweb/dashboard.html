<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSmart — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>

/* ============================================================
   StockSmart — unified design system v2

   SIGNATURE ELEMENT: every card/row carries a 3px accent rail
   on its leading edge — quiet at rest, fully lit on hover/focus.
   It's the one motif repeated across all 5 pages (KPI cards,
   table rows, activity items, quick actions) to read as one
   designed system rather than five separate screens.
   ============================================================ */


*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:var(--text-900);
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.brand,.stat-value,.section-title{
  font-family:'Plus Jakarta Sans', 'Inter', sans-serif;
}

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:#d2d4e6; border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

a{ text-decoration:none; color:inherit; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }

:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

/* Sidebar (brand/nav/badges/avatar/mobile-toggle), .app grid, .main,
   .topbar, .icon-btn, .notif-dot and #liveClock are now owned entirely by
   assets/css/app.css — no local overrides (the old ones here drifted from
   the shared values: a 42px icon-btn instead of 38px, an account-menu
   positioned 4px off, etc. — exactly the per-page inconsistency being
   eliminated). */

/* ---------------- Stat cards ---------------- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(6, 1fr);
  gap:16px;
  margin-bottom:22px;
}

.stat-card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  padding:20px 20px 20px 23px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  opacity:0;
  transform:translateY(14px);
  animation:cardIn .55s var(--ease) forwards;
  transition:box-shadow .22s var(--ease), transform .22s var(--ease);
}
/* signature: leading accent rail, quiet at rest, lit on hover */
.stat-card::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0;
  width:3px;
  background:var(--rail-color, var(--accent));
  opacity:.35;
  transition:opacity .22s var(--ease), width .22s var(--ease);
}
.stat-card:hover{ box-shadow:var(--shadow-lg); transform:translateY(-3px); }
.stat-card:hover::before{ opacity:1; width:4px; }
.stat-card:nth-child(1){ animation-delay:.02s; }
.stat-card:nth-child(2){ animation-delay:.08s; }
.stat-card:nth-child(3){ animation-delay:.14s; }
.stat-card:nth-child(4){ animation-delay:.20s; }
.stat-card:nth-child(5){ animation-delay:.26s; }
.stat-card:nth-child(6){ animation-delay:.32s; }

@keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }

.stat-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }

.stat-icon{
  width:42px; height:42px;
  border-radius:12px;
  display:grid; place-items:center;
}
.stat-icon svg{ width:21px; height:21px; }
.stat-icon.blue{ background:var(--accent-dim); color:var(--accent); }
.stat-icon.amber{ background:var(--amber-bg); color:var(--amber); }
.stat-icon.red{ background:var(--red-bg); color:var(--red); }
.stat-icon.green{ background:var(--green-bg); color:var(--green); }
.stat-icon.purple{ background:var(--purple-bg); color:var(--purple); }
.stat-icon.teal{ background:var(--teal-bg); color:var(--teal); }

.trend{
  display:flex; align-items:center; gap:3px;
  font-size:11.5px; font-weight:700;
  padding:3px 8px 3px 6px;
  border-radius:20px;
}
.trend svg{ width:12px; height:12px; }
.trend.up{ color:var(--green); background:var(--green-bg); }
.trend.down{ color:var(--red); background:var(--red-bg); }

.stat-value{
  font-size:28px;
  font-weight:800;
  letter-spacing:-.02em;
  margin-bottom:4px;
  font-variant-numeric:tabular-nums;
}
.stat-label{ font-size:12.5px; color:var(--text-600); font-weight:500; }

/* ---------------- Section layout ---------------- */
.grid-2col{
  display:grid;
  grid-template-columns:1.62fr 1fr;
  gap:18px;
  align-items:start;
}

.panel{
  background:var(--surface);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--line);
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:10px;
}
.panel-header h3{ font-size:15.5px; font-weight:700; letter-spacing:-.01em; }
.panel-header .sub{ font-size:11.5px; color:var(--text-400); font-weight:500; margin-top:2px; }
.panel-link{
  color:var(--accent);
  font-size:12.5px;
  font-weight:700;
  display:flex; align-items:center; gap:4px;
  transition:gap .15s var(--ease);
}
.panel-link:hover{ gap:7px; }
.panel-link svg{ width:13px; height:13px; }

/* ---------------- Chart ---------------- */
.chart-legend{ display:flex; gap:16px; margin-bottom:2px; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-600); font-weight:500; }
.legend-dot{ width:8px; height:8px; border-radius:50%; }
.legend-dot.this{ background:var(--accent); }
.legend-dot.last{ background:#d6daf9; }

.chart-wrap{
  height:200px;
  display:flex;
  align-items:flex-end;
  gap:20px;
  padding:28px 6px 0;
  border-bottom:1px dashed var(--line);
  position:relative;
}
.chart-wrap::before{
  content:'';
  position:absolute;
  left:0; right:0; top:0; bottom:0;
  background-image:repeating-linear-gradient(to top, var(--line) 0, var(--line) 1px, transparent 1px, transparent 25%);
  opacity:.6;
  pointer-events:none;
}

.bar-group{ flex:1; display:flex; align-items:flex-end; justify-content:center; gap:4px; height:100%; position:relative; }

.bar{
  width:100%;
  max-width:26px;
  border-radius:7px 7px 0 0;
  background:linear-gradient(180deg, var(--accent-light), var(--accent));
  position:relative;
  height:0;
  transition:height 1s var(--ease);
  cursor:pointer;
}
.bar.last-week{ background:#dde0fa; }

.bar .tooltip{
  position:absolute;
  top:-30px; left:50%; transform:translateX(-50%);
  background:var(--navy-900);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:4px 8px;
  border-radius:7px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s var(--ease);
}
.bar:hover .tooltip{ opacity:1; }
.bar:hover{ filter:brightness(1.08); }

.chart-days{
  display:flex;
  justify-content:space-around;
  padding:10px 6px 0;
  color:var(--text-400);
  font-size:12px;
  font-weight:600;
}

.chart-footer{
  display:flex; justify-content:space-between; align-items:center;
  margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
}
.chart-footer .total-label{ font-size:11.5px; color:var(--text-400); }
.chart-footer .total-value{ font-size:18px; font-weight:800; }

/* ---------------- Tables ---------------- */
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; }

thead th{
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  color:var(--text-400);
  text-transform:uppercase;
  padding:0 12px 12px;
  border-bottom:1.5px solid var(--line);
}

tbody td{
  padding:13px 12px;
  font-size:13.3px;
  color:var(--text-900);
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
tbody tr{ transition:background .15s var(--ease), box-shadow .15s var(--ease); }
tbody tr:hover{ background:var(--bg); box-shadow:inset 3px 0 0 var(--accent); }
tbody tr:last-child td{ border-bottom:none; }

.cell-strong{ font-weight:700; }
.cell-muted{ color:var(--text-400); }

.prod-cell{ display:flex; align-items:center; gap:10px; }
.prod-thumb{
  width:34px; height:34px;
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

.status-pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.status-pill::before{ content:''; width:6px; height:6px; border-radius:50%; }
.status-pill.critical{ background:var(--red-bg); color:var(--red); }
.status-pill.critical::before{ background:var(--red); }
.status-pill.low{ background:var(--amber-bg); color:var(--amber); }
.status-pill.low::before{ background:var(--amber); }
.status-pill.ok{ background:var(--green-bg); color:var(--green); }
.status-pill.ok::before{ background:var(--green); }

.progress-track{
  width:60px; height:5px; border-radius:10px;
  background:var(--line); overflow:hidden; display:inline-block; margin-left:8px; vertical-align:middle;
}
.progress-fill{ height:100%; border-radius:10px; }

/* ---------------- Quick actions ---------------- */
.quick-actions{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px;
}
.qa-btn{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:18px 16px 18px 19px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:12px;
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
  text-align:left;
}
.qa-btn::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0;
  width:3px;
  background:var(--accent);
  opacity:.25;
  transition:opacity .2s var(--ease), width .2s var(--ease);
}
.qa-btn:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
  border-color:transparent;
}
.qa-btn:hover::before{ opacity:1; width:4px; }
.qa-icon{
  width:40px; height:40px;
  border-radius:11px;
  display:grid; place-items:center;
  transition:transform .25s var(--ease);
}
.qa-btn:hover .qa-icon{ transform:scale(1.08) rotate(-4deg); }
.qa-icon svg{ width:20px; height:20px; }
.qa-title{ font-size:13.5px; font-weight:700; }
.qa-sub{ font-size:11.5px; color:var(--text-400); }

/* ---------------- Activity feed ---------------- */
.activity-feed{ display:flex; flex-direction:column; }
.activity-item{
  display:flex; gap:13px;
  padding:13px 0 13px 10px;
  margin-left:-10px;
  border-bottom:1px solid var(--line);
  border-radius:10px;
  position:relative;
  transition:background .15s var(--ease), box-shadow .15s var(--ease);
}
.activity-item:hover{ background:var(--bg); box-shadow:inset 3px 0 0 var(--accent); }
.activity-item:last-child{ border-bottom:none; padding-bottom:0; }
.activity-item:first-child{ padding-top:0; }

.activity-icon{
  width:34px; height:34px;
  border-radius:10px;
  display:grid; place-items:center;
  flex-shrink:0;
}
.activity-icon svg{ width:16px; height:16px; }

.activity-body{ flex:1; min-width:0; }
.activity-body p{ font-size:13px; line-height:1.45; }
.activity-body b{ font-weight:700; }
.activity-time{ font-size:11px; color:var(--text-400); margin-top:3px; }

/* ---------------- Expiry list ---------------- */
.expiry-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:13px 0; border-bottom:1px solid var(--line);
}
.expiry-item:last-child{ border-bottom:none; padding-bottom:0; }
.expiry-item:first-child{ padding-top:0; }
.expiry-left{ display:flex; align-items:center; gap:11px; min-width:0; }
.expiry-icon{
  width:32px; height:32px; border-radius:9px;
  background:var(--red-bg); color:var(--red);
  display:grid; place-items:center; flex-shrink:0; font-weight:800; font-size:14px;
}
.expiry-left b{ font-size:13.3px; display:block; }
.expiry-left p{ font-size:11.5px; color:var(--text-400); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.expiry-right{ text-align:right; flex-shrink:0; padding-left:10px; }
.expiry-right b{ font-size:13px; color:var(--text-900); display:block; }
.expiry-right .days-left{ font-size:11px; font-weight:700; margin-top:2px; }
.days-left.urgent{ color:var(--red); }
.days-left.soon{ color:var(--amber); }

/* ---------------- Section title (Quick Actions / Activity) ---------------- */
.section-title{ font-size:15.5px; font-weight:700; margin-bottom:16px; letter-spacing:-.01em; }

/* ---------------- Responsive ---------------- */
@media (max-width:1240px){
  .stats-grid{ grid-template-columns:repeat(3, 1fr); }
  .quick-actions{ grid-template-columns:repeat(2, 1fr); }
}

@media (max-width:1080px){
  .grid-2col{ grid-template-columns:1fr; }
}

@media (max-width:880px){
  .stats-grid{ grid-template-columns:repeat(2, 1fr); }
}

@media (max-width:560px){
  .stats-grid{ grid-template-columns:1fr 1fr; }
  .quick-actions{ grid-template-columns:1fr 1fr; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important; }
}

/* Account menu, notif panel, and toast are now owned entirely by
   assets/css/app.css — the local copies here had drifted (account-menu
   4px lower, notif-panel 20px narrower, different shadow tokens). */
</style>
<script src="assets/js/currency.js"></script>
<script defer src="assets/js/nav-guard.js"></script>
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <!--SIDEBAR-->

  <!-- ============ MAIN ============ -->
  <main class="main">

    <!--TOPBAR-->

    <!-- Stat cards -->
    <section class="stats-grid" id="statsGrid"></section>

    <!-- Sales overview + tables -->
    <section class="grid-2col">
      <div class="left-col">

        <!-- Sales Overview chart -->
        <div class="panel">
          <div class="panel-header">
            <div>
              <h3>Sales Overview</h3>
              <p class="sub">This week vs. last week</p>
            </div>
            <a href="#" class="panel-link">Full report
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>

          <div class="chart-legend">
            <span class="legend-item"><span class="legend-dot this"></span>This week</span>
            <span class="legend-item"><span class="legend-dot last"></span>Last week</span>
          </div>

          <div class="chart-wrap" id="chartWrap"></div>
          <div class="chart-days" id="chartDays"></div>

          <div class="chart-footer">
            <span class="total-label">Weekly total</span>
            <span class="total-value" id="weeklyTotal">Rs. 0</span>
          </div>
        </div>

        <!-- Recent Sales table -->
        <div class="panel">
          <div class="panel-header">
            <div><h3>Recent Sales</h3></div>
            <a href="#" class="panel-link">View all
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Category</th><th>Qty</th><th>Amount</th><th>Date</th></tr></thead>
              <tbody id="recentSalesBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="panel">
          <h3 class="section-title">Quick Actions</h3>
          <div class="quick-actions">
            <button class="qa-btn" data-action="add-product">
              <div class="qa-icon" style="background:var(--accent-dim);color:var(--accent)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </div>
              <div class="qa-title">Add Product</div>
              <div class="qa-sub">Create a new SKU</div>
            </button>
            <button class="qa-btn" data-action="update-inventory">
              <div class="qa-icon" style="background:var(--teal-bg);color:var(--teal)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
              </div>
              <div class="qa-title">Update Inventory</div>
              <div class="qa-sub">Adjust stock counts</div>
            </button>
            <button class="qa-btn" data-action="new-checkout">
              <div class="qa-icon" style="background:var(--purple-bg);color:var(--purple)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
              </div>
              <div class="qa-title">New Checkout</div>
              <div class="qa-sub">Record a sale</div>
            </button>
            <button class="qa-btn" data-action="generate-report">
              <div class="qa-icon" style="background:var(--amber-bg);color:var(--amber)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              </div>
              <div class="qa-title">Generate Report</div>
              <div class="qa-sub">Export latest data</div>
            </button>
          </div>
        </div>

      </div>

      <div class="right-col">

        <!-- Low Stock -->
        <div class="panel">
          <div class="panel-header">
            <div><h3>Low Stock Products</h3></div>
            <a href="#" class="panel-link">Restock all
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Product</th><th>Stock</th><th>Status</th></tr></thead>
              <tbody id="lowStockBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Expiry Alerts -->
        <div class="panel">
          <div class="panel-header">
            <div><h3>Expiry Alerts</h3></div>
            <a href="#" class="panel-link">Manage
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
          <div id="expiryList"></div>
        </div>

        <!-- Recent Activity -->
        <div class="panel">
          <h3 class="section-title">Recent Activity</h3>
          <div class="activity-feed" id="activityFeed"></div>
        </div>

      </div>
    </section>

  </main>
</div>

<script>
/* ============================================================
   LIVE DATA
   Fetched from api/dashboard.php on load. Every render function
   below is unchanged — it still expects the exact same shape that
   SAMPLE_DATA used to provide locally.
   ============================================================ */

const DASHBOARD_API_URL = 'api/dashboard.php';

async function loadDashboardData(){
  const res = await fetch(DASHBOARD_API_URL);
  if(!res.ok) throw new Error('Failed to load dashboard data');
  return res.json();
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */

const fmtNum = n => Number(n).toLocaleString('en-IN');

function trendSvg(dir){
  return dir === 'up'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
}

/* ---- Stat cards ---- */
function renderStats(data){
  const cfg = [
    { key:'totalProducts',  label:'Total Products',    icon:'box',     color:'blue',
      svg:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>' },
    { key:'lowStock',       label:'Low Stock Items',   icon:'warn',    color:'amber',
      svg:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>' },
    { key:'expiringSoon',   label:'Expiring Soon',     icon:'clock',   color:'red',
      svg:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>' },
    { key:'totalSuppliers', label:'Total Suppliers',   icon:'truck',   color:'green',
      svg:'<rect x="2" y="7" width="13" height="11" rx="2"/><path d="M15 10h4l3 3v5h-7z"/><circle cx="7" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/>' },
    { key:'todaysSales',     label:"Today's Sales",     icon:'banknote', color:'purple',
      svg:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>' },
    { key:'restockAlerts',  label:'Restocking Alerts', icon:'restock', color:'teal',
      svg:'<path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>' }
  ];

  const grid = document.getElementById('statsGrid');
  grid.innerHTML = cfg.map(c => {
    const d = data[c.key];
    const isCurrency = c.key === 'todaysSales';
    return `
      <div class="stat-card">
        <div class="stat-top">
          <div class="stat-icon ${c.color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.svg}</svg></div>
          <div class="trend ${d.dir}">${trendSvg(d.dir)}${d.trend}%</div>
        </div>
        <div class="stat-value" data-target="${d.value}" data-currency="${isCurrency}">0</div>
        <div class="stat-label">${c.label}</div>
      </div>`;
  }).join('');

  animateCounters();
}

function animateCounters(){
  document.querySelectorAll('.stat-value').forEach(el => {
    const target = Number(el.dataset.target);
    const isCurrency = el.dataset.currency === 'true';
    const duration = 1100;
    const start = performance.now();
    function tick(now){
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(target * eased);
      el.textContent = isCurrency ? fmtRs(val) : fmtNum(val);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

/* ---- Sales chart ---- */
function renderChart(weeklySales){
  const max = Math.max(...weeklySales.flatMap(d => [d.thisWeek, d.lastWeek]));
  const wrap = document.getElementById('chartWrap');
  const daysRow = document.getElementById('chartDays');

  wrap.innerHTML = weeklySales.map(d => {
    const hThis = Math.round((d.thisWeek / max) * 100);
    const hLast = Math.round((d.lastWeek / max) * 100);
    return `
      <div class="bar-group">
        <div class="bar last-week" data-h="${hLast}"><span class="tooltip">${fmtRs(d.lastWeek)}</span></div>
        <div class="bar" data-h="${hThis}"><span class="tooltip">${fmtRs(d.thisWeek)}</span></div>
      </div>`;
  }).join('');

  daysRow.innerHTML = weeklySales.map(d => `<span>${d.day}</span>`).join('');

  const total = weeklySales.reduce((sum, d) => sum + d.thisWeek, 0);
  document.getElementById('weeklyTotal').textContent = fmtRs(total);

  requestAnimationFrame(() => {
    setTimeout(() => {
      wrap.querySelectorAll('.bar').forEach(bar => {
        bar.style.height = bar.dataset.h + '%';
      });
    }, 80);
  });
}

/* ---- Recent sales table ---- */
function renderRecentSales(rows){
  const body = document.getElementById('recentSalesBody');
  body.innerHTML = rows.map(r => `
    <tr>
      <td>${r.category}</td>
      <td class="cell-muted">${r.qty}</td>
      <td class="cell-strong">${fmtRs(r.amount)}</td>
      <td class="cell-muted">${formatDate(r.date)}</td>
    </tr>`).join('');
}

/* ---- Low stock table ---- */
function renderLowStock(rows){
  const body = document.getElementById('lowStockBody');
  const palette = ['#e8eaff','#fdf3e3','#f2ecfd','#e7f8f6','#fcecec','#e9f9f0'];
  body.innerHTML = rows.map((r, i) => {
    const pct = Math.min(100, Math.round((r.stock / r.reorder) * 100));
    const critical = r.stock <= r.reorder * 0.4;
    const fillColor = critical ? 'var(--red)' : 'var(--amber)';
    return `
      <tr>
        <td>
          <div class="prod-cell">
            <div class="prod-thumb" style="background:${palette[i % palette.length]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;opacity:0.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
            <span class="cell-strong">${r.name}</span>
          </div>
        </td>
        <td class="cell-muted">${r.stock} units
          <span class="progress-track"><span class="progress-fill" style="width:${pct}%;background:${fillColor}"></span></span>
        </td>
        <td>${critical ? '<span class="status-pill critical">Critical</span>' : '<span class="status-pill low">Low</span>'}</td>
      </tr>`;
  }).join('');
}

/* ---- Expiry alerts list ---- */
function renderExpiry(rows){
  const list = document.getElementById('expiryList');
  list.innerHTML = rows.map(r => {
    const urgent = r.daysLeft <= 2;
    const dateLabel = formatExpiryDate(r.daysLeft);
    return `
      <div class="expiry-item">
        <div class="expiry-left">
          <div class="expiry-icon">!</div>
          <div>
            <b>${r.name}</b>
            <p>Batch #${r.batch} · ${r.stock} units in stock</p>
          </div>
        </div>
        <div class="expiry-right">
          <b>${dateLabel}</b>
          <div class="days-left ${urgent ? 'urgent' : 'soon'}">${r.daysLeft === 0 ? 'Today' : r.daysLeft + ' days left'}</div>
        </div>
      </div>`;
  }).join('');
}

/* ---- Activity feed ---- */
function renderActivity(items){
  const iconMap = {
    add:      { bg:'var(--accent-dim)', color:'var(--accent)', svg:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>' },
    update:   { bg:'var(--teal-bg)', color:'var(--teal)', svg:'<path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>' },
    checkout: { bg:'var(--purple-bg)', color:'var(--purple)', svg:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>' },
    alert:    { bg:'var(--amber-bg)', color:'var(--amber)', svg:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>' }
  };
  const feed = document.getElementById('activityFeed');
  feed.innerHTML = items.map(item => {
    const m = iconMap[item.type];
    return `
      <div class="activity-item">
        <div class="activity-icon" style="background:${m.bg};color:${m.color}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.svg}</svg>
        </div>
        <div class="activity-body">
          <p>${item.text}</p>
          <div class="activity-time">${item.time}</div>
        </div>
      </div>`;
  }).join('');
}

/* Sidebar ALERTS badge counts are now handled centrally by
   assets/js/nav-guard.js (fillBadgeCounts) via api/notifications.php,
   the same source every page uses — this used to read data.stats
   from api/dashboard.php instead, a second number that could drift. */

/* ---- Date helpers ---- */
function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function formatExpiryDate(daysLeft){
  const d = new Date();
  d.setDate(d.getDate() + daysLeft);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
}

/* Live clock and mobile sidebar toggle are now handled centrally by
   assets/js/nav-guard.js (initLiveClock/initSidebarToggle) against the
   shared #liveClock/#liveDate/#sidebarToggle markup every page renders. */

/* ---- Quick action buttons — each navigates to its real page ---- */
function initQuickActions(){
  const destinations = {
    'add-product':       'products.php',
    'update-inventory':  'inventory.php',
    'new-checkout':      'checkout.php',
    'generate-report':   'reports.php'
  };
  document.querySelectorAll('.qa-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.style.transform = 'scale(.96)';
      setTimeout(() => { btn.style.transform = ''; }, 140);
      const dest = destinations[btn.dataset.action];
      if (dest) window.location.href = dest;
    });
  });
}

/* ---- Toast helper ---- */
function showToast(msg, isError){
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

/* Notification bell and account/profile chip (avatar/name/role, dropdown,
   Logout) are now handled centrally by assets/js/nav-guard.js
   (initNotifBell/fillUserChip/fillProfileCard) against the shared topbar
   and sidebar markup every page renders. */

/* ---- Global search — jumps to Products pre-filtered by the typed term ---- */
function initGlobalSearch(){
  const input = document.getElementById('globalSearch');
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const q = input.value.trim();
    window.location.href = q ? `products.php?search=${encodeURIComponent(q)}` : 'products.php';
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  initQuickActions();
  initGlobalSearch();

  try {
    const data = await loadDashboardData();
    lastDashboardData = data;
    renderStats(data.stats);
    renderChart(data.weeklySales);
    renderRecentSales(data.recentSales);
    renderLowStock(data.lowStockProducts);
    renderExpiry(data.expiryAlerts);
    renderActivity(data.activity);
  } catch (err) {
    console.error(err);
    showToast('Could not load dashboard data from the server', true);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
