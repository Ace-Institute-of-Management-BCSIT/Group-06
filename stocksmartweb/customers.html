<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSmart — Customers</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .cust-name{font-weight:700;font-size:13.5px;}
  .cust-sub{font-size:11.5px;color:var(--text-400);margin-top:1px;}
  .history-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:13px;}
  .history-item .status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:capitalize;}
  @media(max-width:880px){ .app{grid-template-columns:1fr;} .sidebar{display:none;} .stats{grid-template-columns:repeat(2,1fr);} }
</style>
<script src="assets/js/currency.js"></script>
<script defer src="assets/js/nav-guard.js"></script>
</head>
<body>
<div class="app">
  <!--SIDEBAR-->

  <main class="main">
    <!--TOPBAR-->

    <div class="stats">
      <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Customers</div></div>
      <div class="stat-card"><div class="stat-value" id="statOrders">0</div><div class="stat-label">Completed Orders</div></div>
      <div class="stat-card"><div class="stat-value" id="statLifetime">Rs. 0</div><div class="stat-label">Lifetime Value</div></div>
      <div class="stat-card"><div class="stat-value" id="statPoints">0</div><div class="stat-label">Loyalty Points Issued</div></div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search by name or phone...">
      </div>
      <button class="btn-add" id="addCustomerBtn" data-perm="customers.manage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Customer
      </button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Lifetime Value</th><th>Loyalty Points</th><th style="text-align:right;">Actions</th></tr>
        </thead>
        <tbody id="customersBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No customers match your search.</div>
    </div>
  </main>
</div>

<!-- Customer Modal -->
<div class="overlay" id="customerOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add Customer</h3>
      <button id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Customer Name</label><input type="text" id="fName"></div>
      <div class="field-row">
        <div class="field"><label>Phone</label><input type="text" id="fPhone"></div>
        <div class="field"><label>Email</label><input type="email" id="fEmail"></div>
      </div>
      <div class="field"><label>Loyalty Points</label><input type="number" id="fPoints" min="0" step="1"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" id="cancelModalBtn">Cancel</button>
      <button class="btn-primary" id="saveCustomerBtn">Save Customer</button>
    </div>
  </div>
</div>

<!-- History Modal -->
<div class="overlay" id="historyOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="historyTitle">Order History</h3>
      <button id="closeHistoryBtn">&times;</button>
    </div>
    <div class="modal-body" id="historyBody" style="padding-top:6px;"></div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg">Saved</span></div>

<script>
const API_URL = 'api/customers.php';
const CSRF_TOKEN = (window.STOCKSMART_USER && window.STOCKSMART_USER.csrf) || '';
let allCustomers = [];
let editingId = null;

function showToast(msg, isError){
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 3000);
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadCustomers(){
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not load customers');
    allCustomers = data.customers;
    render();
  } catch (err) { showToast(err.message, true); }
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = allCustomers.filter(c =>
    !q || (c.customer_name || '').toLowerCase().includes(q) || (c.phone || '').includes(q)
  );

  document.getElementById('statTotal').textContent = allCustomers.length;
  document.getElementById('statOrders').textContent = allCustomers.reduce((s, c) => s + Number(c.order_count || 0), 0);
  document.getElementById('statLifetime').textContent = fmtRs(allCustomers.reduce((s, c) => s + Number(c.lifetime_value || 0), 0));
  document.getElementById('statPoints').textContent = Math.round(allCustomers.reduce((s, c) => s + Number(c.loyalty_points || 0), 0));

  const tbody = document.getElementById('customersBody');
  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';

  tbody.innerHTML = filtered.map(c => `
    <tr>
      <td><div class="cust-name">${escapeHtml(c.customer_name)}</div><div class="cust-sub">${escapeHtml(c.email || '')}</div></td>
      <td>${escapeHtml(c.phone || '—')}</td>
      <td>${c.order_count || 0}</td>
      <td>${fmtRs(c.lifetime_value || 0)}</td>
      <td>${Math.round(c.loyalty_points || 0)}</td>
      <td>
        <div class="row-actions" style="justify-content:flex-end;">
          <button title="Order History" data-history="${c.customer_id}" data-name="${escapeHtml(c.customer_name)}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </button>
          <button title="Edit" data-edit="${c.customer_id}" data-perm="customers.manage">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          </button>
        </div>
      </td>
    </tr>`).join('');

  if (window.STOCKSMART_USER) {
    document.querySelectorAll('[data-perm]').forEach(el => {
      const perms = window.STOCKSMART_USER.permissions || [];
      const req = el.getAttribute('data-perm').split(',').map(p => p.trim());
      el.style.display = (perms.includes('*') || req.some(p => perms.includes(p))) ? '' : 'none';
    });
  }
}

document.getElementById('searchInput').addEventListener('input', render);

function openModal(customer){
  editingId = customer ? customer.customer_id : null;
  document.getElementById('modalTitle').textContent = customer ? 'Edit Customer' : 'Add Customer';
  document.getElementById('fName').value = customer ? customer.customer_name : '';
  document.getElementById('fPhone').value = customer ? (customer.phone || '') : '';
  document.getElementById('fEmail').value = customer ? (customer.email || '') : '';
  document.getElementById('fPoints').value = customer ? customer.loyalty_points : 0;
  document.getElementById('customerOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('customerOverlay').classList.remove('open'); }

document.getElementById('addCustomerBtn').addEventListener('click', () => openModal(null));
document.getElementById('closeModalBtn').addEventListener('click', closeModal);
document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

document.getElementById('customersBody').addEventListener('click', async e => {
  const editBtn = e.target.closest('[data-edit]');
  const historyBtn = e.target.closest('[data-history]');

  if (editBtn) {
    const c = allCustomers.find(x => x.customer_id === parseInt(editBtn.dataset.edit, 10));
    if (c) openModal(c);
  }
  if (historyBtn) {
    document.getElementById('historyTitle').textContent = 'Order History — ' + historyBtn.dataset.name;
    document.getElementById('historyBody').innerHTML = '<p style="color:var(--text-400);font-size:13px;">Loading…</p>';
    document.getElementById('historyOverlay').classList.add('open');
    try {
      const res = await fetch(`${API_URL}?action=history&id=${historyBtn.dataset.history}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load history');
      document.getElementById('historyBody').innerHTML = data.orders.length
        ? data.orders.map(o => `
            <div class="history-item">
              <div><b>${escapeHtml(o.order_number)}</b><div style="color:var(--text-400);">${new Date(o.order_date.replace(' ','T')).toLocaleDateString()}</div></div>
              <div style="text-align:right;">${fmtRs(o.grand_total)}<div><span class="status status-${o.order_status}">${o.order_status}</span></div></div>
            </div>`).join('')
        : '<p style="color:var(--text-400);font-size:13px;text-align:center;padding:20px 0;">No orders yet.</p>';
    } catch (err) {
      document.getElementById('historyBody').innerHTML = `<p style="color:var(--red);font-size:13px;">${escapeHtml(err.message)}</p>`;
    }
  }
});
document.getElementById('closeHistoryBtn').addEventListener('click', () => document.getElementById('historyOverlay').classList.remove('open'));

document.getElementById('saveCustomerBtn').addEventListener('click', async () => {
  const payload = {
    customer_name: document.getElementById('fName').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    email: document.getElementById('fEmail').value.trim(),
    loyalty_points: parseFloat(document.getElementById('fPoints').value) || 0,
  };
  if (!payload.customer_name) { showToast('Customer name is required', true); return; }

  const btn = document.getElementById('saveCustomerBtn');
  btn.disabled = true;
  try {
    const res = await fetch(editingId ? `${API_URL}?id=${editingId}` : API_URL, {
      method: editingId ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save the customer');
    showToast(editingId ? 'Customer updated' : 'Customer created');
    closeModal();
    await loadCustomers();
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

loadCustomers();
</script>
</body>
</html>
