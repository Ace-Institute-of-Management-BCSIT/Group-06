<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSmart — Set Up Authenticator App (2FA)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Embedded lightweight qrcode generator script -->
  <script src="assets/js/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0f1b35;
      --accent:     #5b6ef5;
      --accent-2:   #7b8df7;
      --text-white: #ffffff;
      --text-dim:   #a8b4cc;
      --text-muted: #6b7a96;
      --border:     #e2e5ed;
      --input-bg:   #f8f9fb;
      --ink:        #111827;
      --ink-mid:    #374151;
      --radius-sm:  8px;
      --radius-md:  12px;
      --radius-lg:  16px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f1f3f8;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 12px 36px rgba(15,27,53,0.08);
      border: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #7b8df7 0%, var(--accent) 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(91,110,245,.35);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
    }
    .brand-name span { color: var(--accent); }

    h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }

    p.sub {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .step-card {
      background: #f8f9fc;
      border: 1px solid #e5e8f0;
      border-radius: var(--radius-md);
      padding: 16px;
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 12px;
    }

    .step-num {
      width: 24px;
      height: 24px;
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    /* QR Code Display */
    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid #e2e8f0;
      margin-top: 8px;
    }

    #qrContainer svg, #qrContainer canvas {
      max-width: 180px;
      height: auto;
    }

    /* Secret Display */
    .secret-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-top: 8px;
    }

    .secret-key {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 2px;
    }

    .btn-copy {
      background: rgba(91,110,245,.1);
      color: var(--accent);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background .15s;
    }

    .btn-copy:hover { background: rgba(91,110,245,.2); }

    /* Code Field */
    .field label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-mid);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 20px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      background: var(--input-bg);
      transition: border-color .15s, box-shadow .15s;
    }

    .field input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(91,110,245,.13);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(91,110,245,.3);
      margin-top: 16px;
    }

    .btn-submit:hover { background: #4a5de0; box-shadow: 0 6px 22px rgba(91,110,245,.4); }
    .btn-submit:disabled { opacity: .6; pointer-events: none; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #111;
      color: #fff;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      opacity: 0;
      transition: opacity .25s, transform .25s;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="box">
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 26 26" fill="none">
          <rect x="3" y="3" width="9" height="9" rx="2" fill="white" opacity=".9"/>
          <rect x="14" y="3" width="9" height="9" rx="2" fill="white" opacity=".6"/>
          <rect x="3" y="14" width="9" height="9" rx="2" fill="white" opacity=".6"/>
          <rect x="14" y="14" width="9" height="9" rx="2" fill="white" opacity=".85"/>
        </svg>
      </div>
      <div class="brand-name">Stock<span>Smart</span></div>
    </div>

    <h2>Set Up Authenticator App (2FA)</h2>
    <p class="sub">StockSmart requires mandatory Auth App 2FA (Ente Auth / Google Authenticator / Authy) to keep your account secure.</p>

    <div class="steps">
      <!-- Step 1: Scan QR -->
      <div class="step-card">
        <div class="step-header">
          <div class="step-num">1</div>
          <span>Scan QR Code with Ente Auth / Auth App</span>
        </div>
        <div class="qr-wrap">
          <div id="qrContainer"></div>
        </div>
      </div>

      <!-- Step 2: Or Secret Key -->
      <div class="step-card">
        <div class="step-header">
          <div class="step-num">2</div>
          <span>Or enter Secret Key manually</span>
        </div>
        <div class="secret-wrap">
          <span class="secret-key" id="secretDisplay">...</span>
          <button type="button" class="btn-copy" id="copyBtn">Copy Key</button>
        </div>
      </div>

      <!-- Step 3: Enter 6-digit TOTP -->
      <div class="step-card">
        <div class="step-header">
          <div class="step-num">3</div>
          <span>Enter 6-digit code from Auth App</span>
        </div>
        <form id="2faForm">
          <div class="field">
            <input type="text" id="totpCode" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="123456" required autocomplete="one-time-code" />
          </div>
          <button type="submit" class="btn-submit" id="submitBtn">Verify & Enable 2FA</button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const userPayload = window.STOCKSMART_USER || {};
    const secret = userPayload.totp_secret || '';
    const otpauthUrl = userPayload.otpauth_url || '';

    // Display formatted secret
    const secretFormatted = secret ? secret.match(/.{1,4}/g).join(' ') : 'JBSW Y3DP EHPK 3PXP';
    document.getElementById('secretDisplay').textContent = secretFormatted;

    // Toast
    function toast(msg, ms = 3000) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), ms);
    }

    // Copy key
    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(secret).then(() => {
        toast('Secret Key copied to clipboard!');
      }).catch(() => {
        toast('Failed to copy key.');
      });
    });

    // Render QR Code using client-side qrcode-generator or fallback SVG
    function renderQRCode(url) {
      const container = document.getElementById('qrContainer');
      if (window.qrcode && url) {
        try {
          const qr = qrcode(0, 'M');
          qr.addData(url);
          qr.make();
          container.innerHTML = qr.createSvgTag({ scalefactor: 4 });
          return;
        } catch (e) { console.error('QR render error:', e); }
      }
      // Fallback if network blocked qrcode-generator script
      container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}" alt="QR Code" style="width:160px;height:160px;" />`;
    }

    if (otpauthUrl) {
      renderQRCode(otpauthUrl);
    }

    // Form submit
    const form = document.getElementById('2faForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const code = document.getElementById('totpCode').value.trim();
      if (code.length !== 6 || !/^\d{6}$/.test(code)) {
        toast('Please enter a valid 6-digit code.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        const res = await fetch('setup-2fa.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, secret }),
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          toast('2FA Enabled! Redirecting...');
          setTimeout(() => {
            window.location.href = data.redirect || 'dashboard.php';
          }, 800);
        } else {
          toast(data.error || 'Verification failed.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Verify & Enable 2FA';
        }
      } catch (err) {
        toast('Network error. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verify & Enable 2FA';
      }
    });
  </script>
</body>
</html>
