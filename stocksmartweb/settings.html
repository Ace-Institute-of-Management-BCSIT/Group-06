<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSmart — Settings</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .field .hint{font-size:11.5px;color:var(--text-400);margin-top:4px;}
  @media(max-width:880px){ .app{grid-template-columns:1fr;} .sidebar{display:none;} }
</style>
<script defer src="assets/js/nav-guard.js"></script>
</head>
<body>
<div class="app">
  <!--SIDEBAR-->

  <main class="main">
    <!--TOPBAR-->

    <div class="card">
      <div class="field">
        <label>Company Name</label>
        <input type="text" id="fCompanyName">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Invoice Prefix</label>
          <input type="text" id="fInvoicePrefix">
          <div class="hint">Used when generating invoice numbers.</div>
        </div>
        <div class="field">
          <label>Default Tax Rate (%)</label>
          <input type="number" id="fTaxRate" min="0" max="100" step="0.1">
          <div class="hint">Applied automatically at checkout.</div>
        </div>
      </div>
      <div class="field">
        <label>Receipt Footer</label>
        <textarea id="fReceiptFooter" rows="2"></textarea>
      </div>
      <div class="field">
        <label>Timezone</label>
        <input type="text" id="fTimezone" placeholder="Asia/Kathmandu">
      </div>
      <button class="btn-primary" id="saveBtn">Save Settings</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg">Saved</span></div>

<script>
const API_URL = 'api/settings.php';
const CSRF_TOKEN = (window.STOCKSMART_USER && window.STOCKSMART_USER.csrf) || '';

function showToast(msg, isError){
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 3000);
}

async function loadSettings(){
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not load settings');
    const s = data.settings;
    document.getElementById('fCompanyName').value = s.company_name || '';
    document.getElementById('fInvoicePrefix').value = s.invoice_prefix || '';
    document.getElementById('fTaxRate').value = s.default_tax_rate || '0';
    document.getElementById('fReceiptFooter').value = s.receipt_footer || '';
    document.getElementById('fTimezone').value = s.timezone || '';
  } catch (err) { showToast(err.message, true); }
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const payload = {
    company_name: document.getElementById('fCompanyName').value.trim(),
    invoice_prefix: document.getElementById('fInvoicePrefix').value.trim(),
    default_tax_rate: document.getElementById('fTaxRate').value,
    receipt_footer: document.getElementById('fReceiptFooter').value.trim(),
    timezone: document.getElementById('fTimezone').value.trim(),
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save settings');
    showToast('Settings saved');
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

loadSettings();
</script>
</body>
</html>
