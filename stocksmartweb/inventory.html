<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSmart — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>

/* ============================================================
   StockSmart Inventory — unified design system v2
   Shares the exact token set, signature accent-rail motif, and
   sidebar treatment with dashboard.html. Data is fetched live
   from api/inventory.php (see the LIVE DATA section of the
   <script> block below).
   ============================================================ */


*{ margin:0; padding:0; box-sizing:border-box; }

body{ background:var(--bg); color:var(--text-900); -webkit-font-smoothing:antialiased; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:#d2d4e6; border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; text-decoration:none; }

:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

/* Sidebar (brand/nav/badges/avatar/mobile-toggle), .app grid, and .main are
   now owned entirely by assets/css/app.css — no local overrides. */

.top-header {
    min-height: 70px;
    background: white;
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
}

.top-header h1 { font-size: 19px; margin-bottom: 4px; font-weight: 800; letter-spacing:-.02em; }

.top-header .crumb { font-size: 12px; color: var(--text-400); display:flex; align-items:center; gap:8px; }
.top-header .crumb .dot{ width:4px; height:4px; border-radius:50%; background:var(--text-400); }
#liveClock{ font-variant-numeric: tabular-nums; color:var(--text-600); font-weight:600; }

.search-form{ position: relative; }
.search-form svg{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:17px; height:17px; color:var(--text-400); pointer-events:none;
}
.search-form input {
    width: 300px;
    max-width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--line);
    padding: 10.5px 15px 10.5px 40px;
    border-radius: 11px;
    outline: none;
    font-size: 13.5px;
    color: var(--text-900);
    transition: border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
}
.search-form input::placeholder{ color:var(--text-400); }
.search-form input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px var(--accent-dim);
}

.search-meta{
  font-size: 11px;
  color: var(--text-400);
  position: absolute;
  margin-top: 4px;
  padding-left: 4px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 18px;
}

.notification {
    position: relative;
    width: 42px; height: 42px;
    border-radius: 11px;
    background: #f6f9fc;
    display: grid;
    place-items: center;
    color: var(--text-500);
    transition: background .18s var(--ease), color .18s var(--ease), transform .15s var(--ease);
}
.notification:hover{ background: var(--accent-dim); color: var(--accent); transform: translateY(-1px); }
.notification svg{ width:19px; height:19px; }
.notif-badge{
  position:absolute; top:6px; right:6px;
  min-width:16px; height:16px; padding:0 3px;
  border-radius:20px; background:var(--red); color:#fff;
  font-size:9.5px; font-weight:800;
  display:grid; place-items:center;
  border:2px solid #fff;
}

.profile {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #f6f9fc;
    padding: 6px 14px 6px 6px;
    border-radius: 12px;
    transition: background .18s var(--ease);
}
.profile:hover{ background: var(--accent-dim); }
.profile b { font-size: 13px; display:block; }
.profile p { font-size: 11px; color: var(--text-400); margin-top:1px; }

/* ================= Stat cards ================= */
.stats-grid {
    padding: 26px 28px 22px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px;
}

.stat-card {
    background: white;
    padding: 22px 22px 22px 25px;
    border-radius: 14px;
    min-height: 175px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    animation: cardIn .55s var(--ease) forwards;
    transition: box-shadow .22s var(--ease), transform .22s var(--ease);
}
/* signature: leading accent rail, shared motif with dashboard.html */
.stat-card::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0;
  width:3px;
  background:var(--rail-color, var(--accent));
  opacity:.35;
  transition:opacity .22s var(--ease), width .22s var(--ease);
}
.stat-card:hover{ box-shadow: var(--shadow-lg); transform: translateY(-4px); }
.stat-card:hover::before{ opacity:1; width:4px; }
.stat-card:nth-child(1){ animation-delay:.02s; }
.stat-card:nth-child(2){ animation-delay:.08s; }
.stat-card:nth-child(3){ animation-delay:.14s; }
.stat-card:nth-child(4){ animation-delay:.20s; }
.stat-card:nth-child(5){ animation-delay:.26s; }

@keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }

.stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    margin-bottom: 18px;
    font-weight: bold;
}
.stat-icon svg{ width:18px; height:18px; }

.stat-icon.cyan { background: var(--accent-dim); color: var(--accent); }
.stat-icon.green { background: var(--green-bg); color: var(--green); }
.stat-icon.yellow { background: var(--amber-bg); color: var(--amber); }
.stat-icon.pink { background: var(--red-bg); color: var(--red); }
.stat-icon.purple { background: var(--purple-bg); color: var(--purple); }

.stat-card h2 { font-size: 25px; margin-bottom: 5px; font-weight: 800; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
.stat-card p { font-size: 13px; color: var(--text-600); font-weight: 500; }

.growth {
    position: absolute;
    right: 22px;
    top: 22px;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3px 8px;
    border-radius: 20px;
}
.growth svg{ width:11px; height:11px; }
.growth.up { color: var(--green); background: var(--green-bg); }
.growth.warn { color: var(--amber); background: var(--amber-bg); }
.growth.down { color: var(--red); background: var(--red-bg); }

.mini-line {
    width: 100%;
    height: 32px;
    margin-top: 18px;
}
.mini-line svg{ width:100%; height:100%; overflow:visible; }
.mini-line path{
  stroke-dasharray: 220;
  stroke-dashoffset: 220;
  animation: drawLine 1.1s var(--ease) forwards;
  animation-delay: .4s;
}
@keyframes drawLine{ to{ stroke-dashoffset: 0; } }

/* ================= Content layout ================= */
.content-layout {
    padding: 0 28px 30px;
    display: grid;
    grid-template-columns: 2.1fr 1fr;
    gap: 26px;
}

.inventory-panel,
.side-card {
    background: white;
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
}

.inventory-panel { overflow: hidden; }

.panel-header {
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 1px solid var(--line);
}

.panel-title { display: flex; align-items: center; gap: 12px; }
.panel-title h3 { font-size: 16px; font-weight: 700; }

.small-icon {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: var(--accent-dim);
    color: var(--accent);
    flex-shrink: 0;
}
.small-icon svg{ width:16px; height:16px; }
.purple-bg { background: var(--purple-bg); color: var(--purple); }
.yellow-bg { background: var(--amber-bg); color: var(--amber); }

.filters { display: flex; gap: 9px; flex-wrap: wrap; }

.filters button {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 8px;
    padding: 9px 15px;
    color: var(--text-600);
    font-size: 12.5px;
    font-weight: 500;
    transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
}
.filters button:hover,
.filters button.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
}

.table-scroll{ overflow-x: auto; }
.inventory-table { width: 100%; border-collapse: collapse; }

.inventory-table thead { background: var(--bg); }
.inventory-table th {
    text-align: left;
    color: var(--text-400);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 15px 22px;
    font-weight: 700;
    white-space: nowrap;
}

.inventory-table td {
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--text-600);
    white-space: nowrap;
}
.inventory-table tbody tr{ transition: background .15s var(--ease), box-shadow .15s var(--ease); }
.inventory-table tbody tr:hover{ background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
.inventory-table tbody tr:last-child td{ border-bottom: none; }

.product-cell { display: flex; align-items: center; gap: 12px; white-space: normal; }

.product-img {
    width: 36px; height: 36px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 18px;
    flex-shrink: 0;
}

.product-cell b { color: var(--text-700); font-weight: 600; }
.product-cell .sku-sub{ font-size:11px; color:var(--text-400); margin-top:2px; }

.status {
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.status::before{ content:''; width:6px; height:6px; border-radius:50%; }
.status.in { background: var(--green-bg); color: var(--green); }
.status.in::before{ background:var(--green); }
.status.low { background: var(--amber-bg); color: var(--amber); }
.status.low::before{ background:var(--amber); }
.status.out { background: var(--red-bg); color: var(--red); }
.status.out::before{ background:var(--red); }
/* "Critical" — stock at or below 40% of the reorder level. Shares the red of
   Out of Stock because it is equally urgent, but is a distinct state. */
.status.critical { background: var(--red-bg); color: var(--red); }
.status.critical::before{ background:var(--red); }

.no-results{
  padding: 50px 22px;
  text-align: center;
  color: var(--text-400);
  display: none;
}
.no-results svg{ width:38px; height:38px; margin-bottom:12px; opacity:.5; }
.no-results p{ font-size:13.5px; }
.no-results.show{ display:block; }

.table-footer {
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.table-footer p { color: var(--text-400); font-size: 12px; }

.pagination { display: flex; gap: 7px; }
.pagination button {
    border: 1px solid var(--line);
    background: white;
    border-radius: 7px;
    padding: 7px 11px;
    color: var(--text-600);
    font-size: 12.5px;
    transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.pagination button:hover{ background:var(--bg); }
.pagination .active-page { background: var(--accent-dim); color: var(--accent); border-color: transparent; font-weight: 700; }

/* ================= Side panels ================= */
.side-panels { display: flex; flex-direction: column; gap: 22px; }
.side-card { padding: 22px; }

.donut-and-list { display: flex; align-items: center; gap: 24px; margin-top: 24px; }

.donut-chart {
    width: 125px; height: 125px;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    transform: scale(0);
    animation: donutIn .6s var(--ease) forwards;
    animation-delay: .2s;
}
@keyframes donutIn{ to{ transform: scale(1); } }
.donut-chart::after {
    content: "";
    position: absolute;
    width: 72px; height: 72px;
    background: white;
    border-radius: 50%;
    top: 26px; left: 26px;
    display: flex;
}
.donut-center{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  z-index:1;
}
.donut-center b{ font-size:15px; font-weight:800; }
.donut-center span{ font-size:9px; color:var(--text-400); }

.category-list { flex: 1; min-width:0; }

.list-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
    font-size: 12px;
    color: var(--text-600);
    cursor: default;
}
.list-row:last-child{ margin-bottom: 0; }
.list-row span { display: flex; align-items: center; gap: 7px; }
.list-row b { font-size: 11px; color: var(--text-400); font-variant-numeric: tabular-nums; }
.list-row i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink:0; }

.cyan-dot { background: var(--accent); }
.green-dot { background: var(--green); }
.yellow-dot { background: var(--amber); }
.orange-dot { background: var(--red); }
.purple-dot { background: var(--purple); }
.gray-dot { background: #cbd5e1; }

.location-list { margin-top: 24px; }
.location-row { margin-bottom: 18px; }
.location-row:last-child{ margin-bottom: 0; }

.location-text {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--text-600);
}
.location-text b { color: var(--text-700); font-variant-numeric: tabular-nums; }

.progress { height: 8px; background: var(--line); border-radius: 10px; overflow: hidden; }
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius: 10px;
    width: 0;
    transition: width 1s var(--ease);
}

/* ================= Quick Actions ================= */
.quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}
.qa-btn {
    background: white;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px 16px 18px 19px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease);
    text-align: left;
}
.qa-btn::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0;
  width:3px;
  background:var(--accent);
  opacity:.25;
  transition:opacity .2s var(--ease), width .2s var(--ease);
}
.qa-btn:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.qa-btn:hover::before{ opacity:1; width:4px; }
.qa-icon {
    width: 40px; height: 40px;
    border-radius: 11px;
    display: grid; place-items: center;
    transition: transform .25s var(--ease);
}
.qa-btn:hover .qa-icon { transform: scale(1.08) rotate(-4deg); }
.qa-icon svg{ width:20px; height:20px; }
.qa-title { font-size: 13.5px; font-weight: 700; color: var(--text-900); }
.qa-sub { font-size: 11.5px; color: var(--text-400); }

/* ================= Activity feed ================= */
.activity-feed { display: flex; flex-direction: column; }
.activity-item {
    display: flex; gap: 13px;
    padding: 13px 0 13px 10px;
    margin-left: -10px;
    border-bottom: 1px solid var(--line);
    border-radius: 10px;
    transition: background .15s var(--ease), box-shadow .15s var(--ease);
}
.activity-item:hover{ background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
.activity-item:last-child{ border-bottom: none; padding-bottom: 0; }
.activity-item:first-child{ padding-top: 0; }
.activity-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: grid; place-items: center;
    flex-shrink: 0;
}
.activity-icon svg{ width:16px; height:16px; }
.activity-body { flex: 1; min-width: 0; }
.activity-body p { font-size: 13px; line-height: 1.45; color: var(--text-700); }
.activity-body b { font-weight: 700; color: var(--text-900); }
.activity-time { font-size: 11px; color: var(--text-400); margin-top: 3px; }

.section-title{ font-size:15.5px; font-weight:700; margin-bottom:16px; letter-spacing:-.01em; }

/* ================= Responsive ================= */
@media (max-width: 1200px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .content-layout { grid-template-columns: 1fr; }
    .quick-actions{ grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 880px) {
    /* sidebar off-canvas behavior now owned by assets/css/app.css */
}

@media (max-width: 800px) {
    .top-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
    }
    .search-form input,
    .search-form input:focus { width: 100%; }
    .stats-grid { grid-template-columns: 1fr; padding: 20px 16px; }
    .content-layout{ padding: 0 16px 24px; }
    .inventory-table { min-width: 900px; }
    .table-scroll { overflow-x: auto; }
    .quick-actions{ grid-template-columns: 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important; }
}

/* ================= Modal, toast & notif dropdown (added) ================= */
.overlay{
  position:fixed;inset:0;background:rgba(15,18,40,0.45);
  display:none;align-items:center;justify-content:center;z-index:200;
  backdrop-filter:blur(2px);
}
.overlay.open{display:flex;}
.modal{
  background:var(--surface);border-radius:16px;width:440px;max-width:92vw;
  box-shadow:0 20px 60px rgba(15,18,40,0.25);animation:pop .16s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:16px;color:var(--text-900);}
.modal-head button{background:none;border:none;font-size:18px;color:var(--text-400);cursor:pointer;}
.modal-body{padding:20px;display:grid;gap:14px;max-height:60vh;overflow-y:auto;}
.modal .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-600);margin-bottom:6px;}
.modal .field input, .modal .field select{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  font-size:13.5px;outline:none;background:#fff;color:var(--text-900);
}
.modal .field input:focus, .modal .field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,110,245,.16);}
.modal .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal .hint{font-size:12px;color:var(--text-400);margin-top:-6px;}
.modal .type-toggle{display:flex;gap:8px;}
.modal .type-toggle button{
  flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-weight:600;font-size:12.5px;color:var(--text-600);cursor:pointer;transition:all .15s var(--ease);
}
.modal .type-toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line);}
.btn-secondary{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:var(--text-600);}
.btn-primary{padding:9px 18px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.btn-primary:hover{background:#4456d6;}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}

.toast{
  position:fixed;bottom:24px;right:24px;background:#0f1226;color:#fff;
  padding:13px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);display:flex;align-items:center;gap:10px;
  transform:translateY(20px);opacity:0;transition:transform .25s ease, opacity .25s ease;z-index:300;
  max-width:360px;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{background:var(--red);}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.toast.error .dot{background:#fff;}

.notif-panel{
  position:absolute;top:56px;right:24px;width:320px;max-height:400px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-lg);display:none;z-index:150;
}
.notif-panel.open{display:block;}
.notif-panel h4{font-size:13px;padding:14px 16px 8px;margin:0;color:var(--text-600);}
.notif-panel .notif-row{padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-700);}
.notif-panel .notif-row b{display:block;font-size:12.5px;color:var(--text-900);margin-bottom:2px;}
.notif-panel .notif-empty{padding:20px 16px;text-align:center;color:var(--text-400);font-size:12.5px;}
.notif-panel .notif-row{cursor:pointer;}
.notif-panel .notif-row.unread b::before{content:'\25CF ';color:var(--accent,#5b6ef5);font-size:9px;}

<script>
/* ============================================================
   LIVE DATA — fetched from api/inventory.php on load.
   ------------------------------------------------------------
   SAMPLE_DATA is kept as the variable name (now populated from
   the database, not hardcoded) since renderInventoryTable() and
   initSearch() both reference SAMPLE_DATA.products directly.
   Every render*() function below is otherwise unchanged.
   ============================================================ */

const INVENTORY_API_URL = 'api/inventory.php';

// inventory.php (the page wrapper) injects window.STOCKSMART_USER, which
// includes a `csrf` field — sent back via X-CSRF-Token on every POST.
const CSRF_TOKEN = (window.STOCKSMART_USER && window.STOCKSMART_USER.csrf) || '';

let SAMPLE_DATA = { stats: {}, products: [], warehouses: [], activity: [], expiringSoonCount: 0 };

function showToast(msg, isError){
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  toastMsg.textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

async function loadInventoryData(){
  const res = await fetch(INVENTORY_API_URL);
  if(!res.ok) throw new Error('Failed to load inventory data');
  SAMPLE_DATA = await res.json();
}

/* ============================================================
   DERIVED DATA
   ============================================================ */

function getAvailable(p){ return p.inStock - p.reserved; }

/* Delegated to window.StockStatus (assets/js/stock-status.js) so this page,
   the Products table, the dashboard widget and the sidebar badge classify the
   same quantity identically. The rule itself is unchanged from what this page
   already did — it gains the "Critical" band the others were using. */
function getStatus(p){
  const st = StockStatus.stockState(getAvailable(p), p.reorderLevel);
  return { text: st.label, cls: st.cls, key: st.key };
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */

const fmtNum = n => Number(n).toLocaleString('en-IN');

function trendSvg(dir){
  if (dir === 'down') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
}

/* ---- Stat cards ---- */
function renderStats(stats){
  const cfg = [
    { key:'totalItems', label:'Total Items', color:'cyan', currency:false,
      svg:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>' },
    { key:'inStock', label:'In Stock', color:'green', currency:false,
      svg:'<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/>' },
    { key:'lowStock', label:'Low Stock', color:'yellow', currency:false,
      svg:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>' },
    { key:'outOfStock', label:'Out of Stock', color:'pink', currency:false,
      svg:'<circle cx="12" cy="12" r="9"/><line x1="8" y1="12" x2="16" y2="12"/>' },
    { key:'totalValue', label:'Total Inventory Value', color:'purple', currency:true,
      svg:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>' }
  ];

  const lineColors = { cyan:'#8b97ff', green:'#169e63', yellow:'#c9790f', pink:'#d8413f', purple:'#8454e8' };
  const grid = document.getElementById('statsGrid');

  grid.innerHTML = cfg.map(c => {
    const d = stats[c.key];
    const lc = lineColors[c.color];
    // deterministic-looking sparkline path per card
    const path = sparklinePath(c.key);
    return `
      <div class="stat-card">
        <div class="growth ${d.dir}">${trendSvg(d.dir === 'down' ? 'down' : 'up')}${d.trend}%</div>
        <div class="stat-icon ${c.color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.svg}</svg></div>
        <h2 class="stat-value" data-target="${d.value}" data-currency="${c.currency}">0</h2>
        <p>${c.label}</p>
        <div class="mini-line">
          <svg viewBox="0 0 100 32" preserveAspectRatio="none">
            <path d="${path}" fill="none" stroke="${lc}" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
      </div>`;
  }).join('');

  animateCounters();
}

function sparklinePath(seed){
  // small deterministic wiggle per stat so each sparkline looks distinct
  const seeds = {
    totalItems: 'M0,22 L15,18 L30,20 L45,10 L60,14 L75,6 L100,9',
    inStock:    'M0,20 L15,21 L30,14 L45,16 L60,9 L75,11 L100,4',
    lowStock:   'M0,10 L15,14 L30,9 L45,18 L60,15 L75,22 L100,17',
    outOfStock: 'M0,8 L15,12 L30,18 L45,15 L60,24 L75,20 L100,26',
    totalValue: 'M0,24 L15,20 L30,21 L45,12 L60,15 L75,7 L100,5'
  };
  return seeds[seed] || 'M0,16 L100,16';
}

function animateCounters(){
  document.querySelectorAll('.stat-value').forEach(el => {
    const target = Number(el.dataset.target);
    const isCurrency = el.dataset.currency === 'true';
    const duration = 1100;
    const start = performance.now();
    function tick(now){
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(target * eased);
      el.textContent = isCurrency ? fmtRs(val) : fmtNum(val);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

/* ---- Inventory table ---- */
function renderInventoryTable(products){
  const body = document.getElementById('inventoryBody');
  const noResults = document.getElementById('noResults');
  const resultsCount = document.getElementById('resultsCount');

  if (products.length === 0) {
    body.innerHTML = '';
    noResults.classList.add('show');
    resultsCount.textContent = 'No items found';
    return;
  }

  noResults.classList.remove('show');
  resultsCount.textContent = `Showing ${products.length} of ${SAMPLE_DATA.products.length} inventory items`;

  body.innerHTML = products.map(p => {
    const available = getAvailable(p);
    const status = getStatus(p);
    return `
      <tr>
        <td>
          <div class="product-cell">
            <div class="product-img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;opacity:0.45"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
            <div><b>${escapeHtml(p.name)}</b></div>
          </div>
        </td>
        <td>${escapeHtml(p.sku)}</td>
        <td>${escapeHtml(p.category)}</td>
        <td>${fmtNum(p.inStock)}</td>
        <td>${fmtNum(p.reserved)}</td>
        <td><b>${fmtNum(available)}</b></td>
        <td><span class="status ${status.cls}">${status.text}</span></td>
        <td>${escapeHtml(p.location)}</td>
      </tr>`;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---- Combined search + category + location + restock filter ----
   restockOnly starts on when the page is opened as inventory.php?filter=restock
   — the destination behind the sidebar's "Restocking Alerts" entry. Reusing
   this existing filter is why no separate restock page was added. */
const filterState = {
  category: null,
  location: null,
  restockOnly: new URLSearchParams(location.search).get('filter') === 'restock'
};

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = SAMPLE_DATA.products.filter(p => {
    const matchesQ = q === '' || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
    const matchesCategory = !filterState.category || p.category === filterState.category;
    const matchesLocation = !filterState.location || p.location.includes(filterState.location);
    // Same predicate as the sidebar badge count and the Products page's
    // "Needs Restocking" filter: available <= the product's own reorder level.
    const matchesRestock = !filterState.restockOnly || StockStatus.needsRestock(getAvailable(p), p.reorderLevel);
    return matchesQ && matchesCategory && matchesLocation && matchesRestock;
  });
  renderInventoryTable(filtered);
}

function initSearch(){
  document.getElementById('searchInput').addEventListener('input', applyFilters);
}

/* ---- Stock by category (donut + list) ---- */
const CATEGORY_COLORS = [
  { dot:'cyan-dot',   hex:'#5b6ef5' },
  { dot:'green-dot',  hex:'#169e63' },
  { dot:'yellow-dot', hex:'#c9790f' },
  { dot:'orange-dot', hex:'#d8413f' },
  { dot:'purple-dot', hex:'#8454e8' },
  { dot:'gray-dot',   hex:'#cbd5e1' }
];

function renderCategoryBreakdown(products){
  const totals = {};
  products.forEach(p => {
    totals[p.category] = (totals[p.category] || 0) + p.inStock;
  });

  const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const grandTotal = entries.reduce((sum, [, v]) => sum + v, 0);

  document.getElementById('donutTotal').textContent = fmtNum(grandTotal);

  let cursor = 0;
  const gradientParts = entries.map(([name, value], i) => {
    const pct = grandTotal > 0 ? (value / grandTotal) * 100 : 0;
    const color = CATEGORY_COLORS[i % CATEGORY_COLORS.length].hex;
    const part = `${color} ${cursor}% ${cursor + pct}%`;
    cursor += pct;
    return part;
  });
  document.getElementById('donutChart').style.background =
    `conic-gradient(${gradientParts.join(', ')})`;

  const list = document.getElementById('categoryList');
  list.innerHTML = entries.map(([name, value], i) => {
    const pct = grandTotal > 0 ? Math.round((value / grandTotal) * 100) : 0;
    const dotClass = CATEGORY_COLORS[i % CATEGORY_COLORS.length].dot;
    return `
      <div class="list-row">
        <span><i class="${dotClass}"></i>${escapeHtml(name)}</span>
        <b>${pct}% (${fmtNum(value)})</b>
      </div>`;
  }).join('');
}

/* ---- Stock by location ---- */
function renderLocationBreakdown(products){
  const totals = {};
  products.forEach(p => {
    totals[p.location] = (totals[p.location] || 0) + p.inStock;
  });

  const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const grandTotal = entries.reduce((sum, [, v]) => sum + v, 0);

  const list = document.getElementById('locationList');
  list.innerHTML = entries.map(([name, value]) => {
    const pct = grandTotal > 0 ? Math.round((value / grandTotal) * 100) : 0;
    return `
      <div class="location-row">
        <div class="location-text">
          <span>${escapeHtml(name)}</span>
          <b>${fmtNum(value)} (${pct}%)</b>
        </div>
        <div class="progress"><div class="progress-fill" data-w="${pct}"></div></div>
      </div>`;
  }).join('');

  requestAnimationFrame(() => {
    setTimeout(() => {
      list.querySelectorAll('.progress-fill').forEach(el => {
        el.style.width = el.dataset.w + '%';
      });
    }, 100);
  });
}

/* ---- Activity feed ---- */
function renderActivity(items){
  const iconMap = {
    add:      { bg:'var(--accent-dim)', color:'var(--accent)', svg:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>' },
    update:   { bg:'var(--green-bg)',  color:'var(--green)',  svg:'<path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>' },
    transfer: { bg:'var(--purple-bg)', color:'var(--purple)', svg:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>' },
    alert:    { bg:'var(--amber-bg)',  color:'var(--amber)',  svg:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>' }
  };
  const feed = document.getElementById('activityFeed');
  feed.innerHTML = items.map(item => {
    const m = iconMap[item.type];
    return `
      <div class="activity-item">
        <div class="activity-icon" style="background:${m.bg};color:${m.color}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.svg}</svg>
        </div>
        <div class="activity-body">
          <p>${item.text}</p>
          <div class="activity-time">${item.time}</div>
        </div>
      </div>`;
  }).join('');
}

/* Sidebar/topbar badge counts, the notification bell, live clock, and
   mobile sidebar toggle are now handled centrally by assets/js/nav-guard.js
   (fillBadgeCounts/initNotifBell/initLiveClock/initSidebarToggle) reading
   the same server-computed alert counts every page uses — this used to
   recompute "restocking" client-side from the visible product list, which
   could drift from the shared count. */

/* ---- Quick actions: Add Product / Update Stock / Transfer Stock / Generate Report ---- */
function initQuickActions(){
  const destinations = {
    'add-product': 'products.php'
  };
  document.querySelectorAll('.qa-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.style.transform = 'scale(.96)';
      setTimeout(() => { btn.style.transform = ''; }, 140);

      const action = btn.dataset.action;
      if (destinations[action]) {
        window.location.href = destinations[action];
      } else if (action === 'update-stock') {
        openStockModal();
      } else if (action === 'transfer-stock') {
        openTransferModal();
      } else if (action === 'generate-report') {
        showToast('Reports module is coming in the next update — see the Reports section of the roadmap.');
      }
    });
  });
}

/* ---- Category / Location / Restock filter pills ---- */
function initFilters(){
  const buttons = Array.from(document.querySelectorAll('.filters button'));
  const catBtn = buttons.find(b => b.dataset.filter === 'all');
  const locBtn = buttons.find(b => b.dataset.filter === 'locations');
  const restockBtn = buttons.find(b => b.dataset.filter === 'restock');

  function categories(){ return [...new Set(SAMPLE_DATA.products.map(p => p.category))].sort(); }
  function locations(){
    const set = new Set();
    SAMPLE_DATA.products.forEach(p => p.location.split(', ').forEach(l => set.add(l)));
    return [...set].sort();
  }

  catBtn.addEventListener('click', () => {
    const list = categories();
    const idx = filterState.category ? list.indexOf(filterState.category) : -1;
    filterState.category = idx + 1 < list.length ? list[idx + 1] : null;
    catBtn.textContent = filterState.category || 'All Categories';
    catBtn.classList.toggle('active', !!filterState.category);
    applyFilters();
  });

  locBtn.addEventListener('click', () => {
    const list = locations();
    const idx = filterState.location ? list.indexOf(filterState.location) : -1;
    filterState.location = idx + 1 < list.length ? list[idx + 1] : null;
    locBtn.textContent = filterState.location || 'All Locations';
    locBtn.classList.toggle('active', !!filterState.location);
    applyFilters();
  });

  restockBtn.addEventListener('click', () => {
    filterState.restockOnly = !filterState.restockOnly;
    restockBtn.classList.toggle('active', filterState.restockOnly);
    applyFilters();
  });

  // Reflect a ?filter=restock deep link in the pill's pressed state, so
  // arriving from the sidebar looks the same as clicking the pill.
  restockBtn.classList.toggle('active', filterState.restockOnly);
}

/* ============================================================
   UPDATE STOCK MODAL
   ============================================================ */
let stockModalType = 'in';

function populateProductSelect(selectEl){
  selectEl.innerHTML = SAMPLE_DATA.products
    .map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${escapeHtml(p.sku)})</option>`)
    .join('');
}

function populateWarehouseSelect(selectEl){
  selectEl.innerHTML = SAMPLE_DATA.warehouses
    .map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`)
    .join('');
}

async function fetchProductWarehouseBreakdown(productId){
  const res = await fetch(`${INVENTORY_API_URL}?action=product_inventory&id=${productId}`);
  if (!res.ok) throw new Error('Could not load warehouse breakdown');
  return res.json();
}

async function refreshStockWarehouseHint(){
  const productId = Number(document.getElementById('stockProduct').value);
  const warehouseId = Number(document.getElementById('stockWarehouse').value);
  if (!productId || !warehouseId) return;
  try {
    const rows = await fetchProductWarehouseBreakdown(productId);
    const row = rows.find(r => r.warehouseId === warehouseId);
    const hint = document.getElementById('stockWarehouseHint');
    hint.textContent = row ? `Currently ${row.onHand} on hand (${row.reserved} reserved, ${row.available} available) in this warehouse.` : '';
  } catch (err) { console.error(err); }
}

function openStockModal(){
  const productSelect = document.getElementById('stockProduct');
  const warehouseSelect = document.getElementById('stockWarehouse');
  populateProductSelect(productSelect);
  populateWarehouseSelect(warehouseSelect);
  document.getElementById('stockQty').value = '';
  document.getElementById('stockNote').value = '';
  setStockType('in');
  refreshStockWarehouseHint();
  document.getElementById('stockOverlay').classList.add('open');
}

function setStockType(type){
  stockModalType = type;
  document.querySelectorAll('#stockOverlay .type-toggle button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  const label = document.getElementById('stockQtyLabel');
  label.textContent = type === 'in' ? 'Quantity to add' : (type === 'out' ? 'Quantity to remove' : 'New exact stock count');
}

document.getElementById('stockModalClose').addEventListener('click', () => document.getElementById('stockOverlay').classList.remove('open'));
document.getElementById('stockCancelBtn').addEventListener('click', () => document.getElementById('stockOverlay').classList.remove('open'));
document.getElementById('stockOverlay').addEventListener('click', e => { if (e.target.id === 'stockOverlay') e.currentTarget.classList.remove('open'); });
document.querySelectorAll('#stockOverlay .type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => setStockType(btn.dataset.type));
});
document.getElementById('stockProduct').addEventListener('change', refreshStockWarehouseHint);
document.getElementById('stockWarehouse').addEventListener('change', refreshStockWarehouseHint);

document.getElementById('stockSaveBtn').addEventListener('click', async () => {
  const productId = Number(document.getElementById('stockProduct').value);
  const warehouseId = Number(document.getElementById('stockWarehouse').value);
  const quantity = Number(document.getElementById('stockQty').value);
  const note = document.getElementById('stockNote').value.trim();

  if (!productId || isNaN(quantity) || quantity < 0) {
    showToast('Please enter a valid quantity.', true);
    return;
  }

  const btn = document.getElementById('stockSaveBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`${INVENTORY_API_URL}?action=stock_adjust`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
      body: JSON.stringify({ productId, warehouseId, type: stockModalType, quantity, note })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not update stock');
    showToast('Stock updated');
    document.getElementById('stockOverlay').classList.remove('open');
    await refreshInventory();
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

/* ============================================================
   TRANSFER STOCK MODAL
   ============================================================ */
async function refreshTransferHint(){
  const productId = Number(document.getElementById('transferProduct').value);
  const fromId = Number(document.getElementById('transferFrom').value);
  if (!productId || !fromId) return;
  try {
    const rows = await fetchProductWarehouseBreakdown(productId);
    const row = rows.find(r => r.warehouseId === fromId);
    document.getElementById('transferHint').textContent = row
      ? `${row.available} unit(s) available to transfer from this warehouse.`
      : '';
  } catch (err) { console.error(err); }
}

function openTransferModal(){
  const productSelect = document.getElementById('transferProduct');
  const fromSelect = document.getElementById('transferFrom');
  const toSelect = document.getElementById('transferTo');
  populateProductSelect(productSelect);
  populateWarehouseSelect(fromSelect);
  populateWarehouseSelect(toSelect);
  if (toSelect.options.length > 1) toSelect.selectedIndex = 1;
  document.getElementById('transferQty').value = '';
  refreshTransferHint();
  document.getElementById('transferOverlay').classList.add('open');
}

document.getElementById('transferModalClose').addEventListener('click', () => document.getElementById('transferOverlay').classList.remove('open'));
document.getElementById('transferCancelBtn').addEventListener('click', () => document.getElementById('transferOverlay').classList.remove('open'));
document.getElementById('transferOverlay').addEventListener('click', e => { if (e.target.id === 'transferOverlay') e.currentTarget.classList.remove('open'); });
document.getElementById('transferProduct').addEventListener('change', refreshTransferHint);
document.getElementById('transferFrom').addEventListener('change', refreshTransferHint);

document.getElementById('transferSaveBtn').addEventListener('click', async () => {
  const productId = Number(document.getElementById('transferProduct').value);
  const fromWarehouseId = Number(document.getElementById('transferFrom').value);
  const toWarehouseId = Number(document.getElementById('transferTo').value);
  const quantity = Number(document.getElementById('transferQty').value);

  if (!productId || !fromWarehouseId || !toWarehouseId || !quantity || quantity <= 0) {
    showToast('Please fill in every field with a valid quantity.', true);
    return;
  }
  if (fromWarehouseId === toWarehouseId) {
    showToast('Source and destination warehouses must be different.', true);
    return;
  }

  const btn = document.getElementById('transferSaveBtn');
  btn.disabled = true;
  try {
    const res = await fetch(`${INVENTORY_API_URL}?action=stock_transfer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
      body: JSON.stringify({ productId, fromWarehouseId, toWarehouseId, quantity })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not transfer stock');
    showToast('Stock transferred');
    document.getElementById('transferOverlay').classList.remove('open');
    await refreshInventory();
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

/* ============================================================
   INIT
   ============================================================ */
async function refreshInventory(){
  await loadInventoryData();
  renderStats(SAMPLE_DATA.stats);
  applyFilters();
  renderCategoryBreakdown(SAMPLE_DATA.products);
  renderLocationBreakdown(SAMPLE_DATA.products);
  renderActivity(SAMPLE_DATA.activity);
}

async function init(){
  initSearch();
  initQuickActions();
  initFilters();

  try {
    await refreshInventory();
  } catch (err) {
    console.error(err);
    showToast('Could not load inventory from the server', true);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
