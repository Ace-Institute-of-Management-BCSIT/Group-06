<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSmart — My Profile</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>

  .sidebar-footer a{margin-left:auto;color:#b6bee3;text-decoration:none;font-size:12px;}
  .sidebar-footer a:hover{color:#fff;}

  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} .app{grid-template-columns:1fr;} .sidebar{display:none;} }

  .profile-card{text-align:center;}
  .profile-avatar-big{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#7b6af2,#9a5cf0);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 14px;box-shadow:0 8px 24px rgba(123,106,242,.35);}
  .profile-card .name{font-size:17px;font-weight:800;margin-bottom:2px;}
  .profile-card .role-pill{display:inline-block;background:var(--accent-dim);color:var(--blue-accent);font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:20px;margin-top:6px;}
  .info-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
  .info-row span{color:var(--text-400);}
  .info-row b{color:var(--text-900);font-weight:600;}

  .tab-btn{padding:10px 16px;border:none;background:none;font-size:13.5px;font-weight:600;color:var(--text-400);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--blue-accent);border-color:var(--blue-accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .history-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:13px;}
  .history-item .type-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:8px;text-transform:capitalize;}
  .tag-add{background:var(--green-bg);color:var(--green);}
  .tag-update{background:var(--accent-dim);color:var(--blue-accent);}
  .tag-delete{background:var(--red-bg);color:var(--red);}
  .tag-checkout{background:var(--purple-bg);color:var(--purple);}
  .tag-alert{background:var(--amber-bg);color:var(--amber);}
  .tag-transfer{background:var(--purple-bg);color:var(--purple);}
  .tag-login{background:var(--green-bg);color:var(--green);}
  .tag-logout{background:var(--red-bg);color:var(--red);}
  .history-item .time{color:var(--text-400);white-space:nowrap;font-size:12px;}
  .empty-hist{padding:20px 0;text-align:center;color:var(--text-400);font-size:13px;}

</style>
<script defer src="assets/js/nav-guard.js"></script>
</head>
<body>
<div class="app">
  <!--SIDEBAR-->

  <main class="main">
    <!--TOPBAR-->

    <div class="grid">
      <!-- LEFT: account summary card -->
      <div>
        <div class="card profile-card">
          <div class="profile-avatar-big" id="bigAvatar">US</div>
          <div class="name" id="profileName">Loading…</div>
          <div style="color:var(--text-400);font-size:13px;" id="profileUsername">@—</div>
          <div class="role-pill" id="profileRole">—</div>

          <div style="margin-top:16px;text-align:left;">
            <div class="info-row"><span>Email</span><b id="infoEmail">—</b></div>
            <div class="info-row"><span>Phone</span><b id="infoPhone">—</b></div>
            <div class="info-row"><span>Member since</span><b id="infoMemberSince">—</b></div>
            <div class="info-row"><span>Last login</span><b id="infoLastLogin">—</b></div>
            <div class="info-row"><span>Status</span><b id="infoStatus">—</b></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: tabs -->
      <div>
        <div class="card">
          <div class="tabs">
            <button class="tab-btn active" data-tab="edit">Edit Profile</button>
            <button class="tab-btn" data-tab="security">Security</button>
            <button class="tab-btn" data-tab="activity">Activity History</button>
            <button class="tab-btn" data-tab="logins">Login History</button>
          </div>

          <!-- EDIT PROFILE -->
          <div class="tab-panel active" id="tab-edit">
            <div class="field-row">
              <div class="field"><label>Full Name</label><input type="text" id="editName"></div>
              <div class="field"><label>Email</label><input type="email" id="editEmail"></div>
            </div>
            <div class="field"><label>Phone Number</label><input type="text" id="editPhone" placeholder="+977-98XXXXXXXX"></div>
            <div class="field-hint" style="font-size:12px;color:var(--text-400);margin-bottom:14px;">Your avatar is generated automatically from your name's initials.</div>
            <button class="btn-primary" id="saveProfileBtn">Save Changes</button>
          </div>

          <!-- SECURITY / CHANGE PASSWORD -->
          <div class="tab-panel" id="tab-security">
            <div class="field"><label>Current Password</label><input type="password" id="currentPassword"></div>
            <div class="field-row">
              <div class="field"><label>New Password</label><input type="password" id="newPassword"></div>
              <div class="field"><label>Confirm New Password</label><input type="password" id="confirmPassword"></div>
            </div>
            <button class="btn-primary" id="changePasswordBtn">Change Password</button>
          </div>

          <!-- ACTIVITY HISTORY -->
          <div class="tab-panel" id="tab-activity">
            <div id="activityList"></div>
          </div>

          <!-- LOGIN HISTORY -->
          <div class="tab-panel" id="tab-logins">
            <div id="loginList"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg">Saved</span></div>

<script>
const API_URL = 'api/profile.php';
const CSRF_TOKEN = (window.STOCKSMART_USER && window.STOCKSMART_USER.csrf) || '';
let profile = null;

function showToast(msg, isError){
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

function tagClass(type){ return 'type-tag tag-' + type; }

async function loadProfile(){
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('Could not load profile');
    profile = await res.json();
    render();
  } catch (err) {
    console.error(err);
    showToast('Could not load your profile from the server', true);
  }
}

function render(){
  document.getElementById('bigAvatar').textContent = profile.avatar;
  document.getElementById('profileName').textContent = profile.name;
  document.getElementById('profileUsername').textContent = '@' + profile.username;
  document.getElementById('profileRole').textContent = profile.role;
  document.getElementById('infoEmail').textContent = profile.email;
  document.getElementById('infoPhone').textContent = profile.phone || '—';
  document.getElementById('infoMemberSince').textContent = profile.memberSince;
  document.getElementById('infoLastLogin').textContent = profile.lastLogin;
  document.getElementById('infoStatus').textContent = profile.status;

  document.getElementById('editName').value = profile.name;
  document.getElementById('editEmail').value = profile.email;
  document.getElementById('editPhone').value = profile.phone || '';

  const actBody = document.getElementById('activityList');
  actBody.innerHTML = profile.activityHistory.length
    ? profile.activityHistory.map(a => `
        <div class="history-item">
          <div><span class="${tagClass(a.type)}">${a.type}</span>${a.text}</div>
          <div class="time">${a.time}</div>
        </div>`).join('')
    : '<div class="empty-hist">No activity recorded yet.</div>';

  const loginBody = document.getElementById('loginList');
  loginBody.innerHTML = profile.loginHistory.length
    ? profile.loginHistory.map(l => `
        <div class="history-item">
          <div><span class="${tagClass(l.type)}">${l.type}</span>${l.type === 'login' ? 'Signed in' : 'Signed out'}</div>
          <div class="time">${l.time}</div>
        </div>`).join('')
    : '<div class="empty-hist">No login history recorded yet.</div>';
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('saveProfileBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveProfileBtn');
  const payload = {
    full_name: document.getElementById('editName').value.trim(),
    email: document.getElementById('editEmail').value.trim(),
    phone: document.getElementById('editPhone').value.trim(),
  };
  btn.disabled = true;
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: {'Content-Type':'application/json','X-CSRF-Token':CSRF_TOKEN},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save changes');
    showToast('Profile updated');
    await loadProfile();
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('changePasswordBtn').addEventListener('click', async () => {
  const btn = document.getElementById('changePasswordBtn');
  const current_password = document.getElementById('currentPassword').value;
  const new_password = document.getElementById('newPassword').value;
  const confirm_password = document.getElementById('confirmPassword').value;

  if (!current_password || !new_password) {
    showToast('Please fill in every password field.', true);
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch(`${API_URL}?action=change_password`, {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-CSRF-Token':CSRF_TOKEN},
      body: JSON.stringify({ current_password, new_password, confirm_password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not change password');
    showToast('Password changed');
    document.getElementById('currentPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

loadProfile();
</script>
</body>
</html>
