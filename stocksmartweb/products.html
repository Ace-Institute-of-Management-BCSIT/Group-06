<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSmart — Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  
  *{box-sizing:border-box;}
  body{margin:0;}

  body{
    background:var(--bg);
    color:var(--text-900);
    -webkit-font-smoothing:antialiased;
  }

  :focus-visible{ outline:2.5px solid var(--blue-accent); outline-offset:2px; }

  /* Sidebar (brand/nav/badges/avatar/mobile-toggle) and the .app grid are
     owned entirely by assets/css/app.css — no local overrides. */

  /* ---------- MAIN ---------- */
  .main{padding:26px 32px 60px;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    gap:24px;
  }
  .topbar h1{font-size:24px;margin:0 0 2px;font-weight:700;letter-spacing:-0.01em;}
  .breadcrumb{font-size:13px;color:var(--text-400);}
  .breadcrumb a{color:var(--blue-accent);text-decoration:none;font-weight:600;}

  .top-actions{display:flex;align-items:center;gap:16px;}
  .top-search{
    position:relative;
  }
  .top-search input{
    width:260px;
    padding:9px 14px 9px 36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13.5px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .top-search input:focus{border-color:var(--blue-accent);box-shadow:0 0 0 3px rgba(91,110,245,.16);}
  .top-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-400);font-size:14px;}

  .icon-btn{
    width:38px;height:38px;border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    position:relative;
    color:var(--text-600);
    transition:background .15s ease;
  }
  .icon-btn:hover{background:var(--accent-dim);}
  .icon-btn .dot{
    position:absolute;top:7px;right:8px;
    width:7px;height:7px;border-radius:50%;
    background:var(--red);
    border:2px solid #fff;
  }
  .user-chip{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .user-chip .who{font-size:13px;}
  .user-chip .who b{display:block;font-weight:700;}
  .user-chip .who span{font-size:11px;color:var(--text-400);}
  .user-chip .caret{color:var(--text-400);font-size:10px;}

  /* ---------- STAT CARDS ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
    margin-bottom:22px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 18px 16px 21px;
    box-shadow:var(--shadow);
    cursor:default;
    position:relative;
    overflow:hidden;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .stat-card::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0;
    width:3px;
    background:var(--blue-accent);
    opacity:.35;
    transition:opacity .22s var(--ease), width .22s var(--ease);
  }
  .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .stat-card:hover::before{opacity:1;width:4px;}
  .stat-icon{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    margin-bottom:14px;
  }
  .stat-icon svg{ width:18px;height:18px; }
  .stat-icon.blue{background:var(--accent-dim);color:var(--blue-accent);}
  .stat-icon.green{background:var(--green-bg);color:var(--green);}
  .stat-icon.amber{background:var(--amber-bg);color:var(--amber);}
  .stat-icon.purple{background:var(--purple-bg);color:var(--purple);}
  .stat-icon.gold{background:var(--amber-bg);color:var(--amber);}
  .stat-value{font-size:23px;font-weight:800;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
  .stat-label{font-size:12.5px;color:var(--text-400);margin-top:2px;}

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .search-wrap{
    flex:1;
    min-width:240px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:10px 14px 10px 38px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13.5px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-wrap input:focus{border-color:var(--blue-accent);box-shadow:0 0 0 3px rgba(91,110,245,.16);}
  .search-wrap .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-400);}

  select.pill, button.pill{
    padding:9px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13.5px;
    font-weight:500;
    color:var(--text-600);
    cursor:pointer;
    outline:none;
  }select.pill:focus, button.pill:focus{border-color:var(--blue-accent);}
  .btn-filter{
    background:var(--accent-dim);
    color:var(--blue-accent);
    border:1px solid #d6daf9;
    font-weight:600;
  }
  .btn-add{
    margin-left:auto;
    background:var(--blue-accent);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;gap:7px;
    box-shadow:0 4px 12px rgba(91,110,245,.35);
    transition:background .15s ease, transform .1s ease;
  }
  .btn-add:hover{background:#4456d6;}
  .btn-add:active{transform:scale(0.97);}

  /* ---------- TABLE ---------- */
  .table-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--text-400);
    font-weight:700;
    padding:14px 18px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--text-600);}
  thead th.sorted{color:var(--blue-accent);}
  thead th .arrow{font-size:9px;margin-left:3px;opacity:.6;}
  tbody td{
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    font-size:13.5px;
    vertical-align:middle;
  }
  tbody tr{transition:background .15s var(--ease), box-shadow .15s var(--ease);}
  tbody tr:hover{background:var(--bg);box-shadow:inset 3px 0 0 var(--blue-accent);}
  tbody tr:last-child td{border-bottom:none;}

  .prod-cell{display:flex;align-items:center;gap:12px;}
  .prod-thumb{
    width:38px;height:38px;border-radius:9px;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
    overflow:hidden;
  }
  .prod-name{font-weight:700;font-size:13.5px;}
  .prod-sub{font-size:11.5px;color:var(--text-400);margin-top:1px;}

  .sku-text{color:var(--text-600);font-variant-numeric:tabular-nums;}
  .cat-text{color:var(--text-600);}

  .stock-cell{display:flex;align-items:center;gap:6px;}
  .stock-cell .level-dot{width:7px;height:7px;border-radius:50%;}
  .stock-num{font-weight:600;}
  .stock-sub{display:block;font-size:11px;font-weight:600;margin-top:1px;}
  .lvl-critical .level-dot{background:var(--red);}
  .lvl-critical .stock-sub{color:var(--red);}
  .lvl-low .level-dot{background:var(--amber);}
  .lvl-low .stock-sub{color:var(--amber);}
  .lvl-medium .level-dot{background:var(--blue-accent);}
  .lvl-medium .stock-sub{color:var(--blue-accent);}
  .lvl-high .level-dot{background:var(--green);}
  .lvl-high .stock-sub{color:var(--green);}

  .price-text{font-weight:600;}

  .status-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:700;
  }
  .status-pill::before{content:"";width:6px;height:6px;border-radius:50%;}
  .status-low{background:var(--amber-bg);color:var(--amber);}
  .status-low::before{background:var(--amber);}
  .status-in{background:var(--green-bg);color:var(--green);}
  .status-in::before{background:var(--green);}
  .status-out{background:var(--red-bg);color:var(--red);}
  .status-out::before{background:var(--red);}

  .row-actions{display:flex;align-items:center;gap:6px;}
  .row-actions button{
    width:30px;height:30px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
    cursor:pointer;
    color:var(--text-400);
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s ease, color .12s ease;
  }
  .row-actions button:hover{background:var(--accent-dim);color:var(--blue-accent);}
  .row-actions .danger:hover{background:var(--red-bg);color:var(--red);}

  .table-footer{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    font-size:12.5px;
    color:var(--text-400);
    border-top:1px solid var(--border);
  }
  .pager{display:flex;gap:6px;}
  .pager button{
    width:30px;height:30px;border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-size:12.5px;
    color:var(--text-600);
  }
  .pager button.active{background:var(--blue-accent);color:#fff;border-color:var(--blue-accent);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}

  .empty-state{padding:60px 20px;text-align:center;color:var(--text-400);}
  .empty-state .ic{font-size:30px;margin-bottom:10px;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(15,18,40,0.45);
    display:none;
    align-items:center;justify-content:center;
    z-index:100;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff;
    border-radius:16px;
    width:440px;
    max-width:92vw;
    box-shadow:0 20px 60px rgba(15,18,40,0.25);
    animation:pop .16s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
  }
  .modal-head h3{margin:0;font-size:16px;}
  .modal-head button{background:none;border:none;font-size:18px;color:var(--text-400);cursor:pointer;}
  .modal-body{padding:20px;display:grid;gap:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-600);margin-bottom:6px;}
  .field input, .field select{
    width:100%;
    padding:10px 12px;
    border-radius:9px;
    border:1px solid var(--border);
    font-size:13.5px;
    outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--blue-accent);box-shadow:0 0 0 3px rgba(91,110,245,.16);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-foot{
    display:flex;justify-content:flex-end;gap:10px;
    padding:16px 20px;
    border-top:1px solid var(--border);
  }
  .btn-secondary{
    padding:9px 16px;border-radius:9px;border:1px solid var(--border);
    background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:var(--text-600);
  }
  .btn-primary{
    padding:9px 18px;border-radius:9px;border:none;
    background:var(--blue-accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer;
  }
  .btn-primary:hover{background:#4456d6;}

  .toast{
    position:fixed;bottom:24px;right:24px;
    background:#0f1226;color:#fff;
    padding:13px 18px;border-radius:10px;
    font-size:13.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    display:flex;align-items:center;gap:10px;
    transform:translateY(20px);opacity:0;
    transition:transform .25s ease, opacity .25s ease;
    z-index:200;
  }
  .toast.show{transform:translateY(0);opacity:1;}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}

  @media(max-width:1100px){
    .stats{grid-template-columns:repeat(3,1fr);}
  }
  @media(max-width:880px){
    .app{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
<script src="assets/js/currency.js"></script>
<script defer src="assets/js/nav-guard.js"></script>
</head>

  <!-- SIDEBAR -->
  <!--SIDEBAR-->

        <div class="stat-value" id="statTotal">0</div>

        <div class="stat-value" id="statOut">0</div>

<script>
/* ===========================================================
   STOCKSMART — Products Page (connected to MySQL via api/products.php)
   Data now comes from the database. All rendering logic below is
   unchanged from the original front-end-only version — only the
   data layer (loadProducts / saveProduct / deleteProduct) talks
   to the backend instead of an in-memory array.
=========================================================== */

let products = [];
let sortKey = null, sortDir = 1;
let editingId = null;
let currentPage = 1;
const pageSize = 8;

const els = {
  body: document.getElementById('tableBody'),
  search: document.getElementById('searchInput'),
  categoryFilter: document.getElementById('categoryFilter'),
  statusFilter: document.getElementById('statusFilter'),
  resultsCount: document.getElementById('resultsCount'),
  pager: document.getElementById('pager'),
  overlay: document.getElementById('overlay'),
  modalTitle: document.getElementById('modalTitle'),
  toast: document.getElementById('toast'),
  toastMsg: document.getElementById('toastMsg'),
};


function levelClass(stock, threshold){
  const ratio = threshold ? stock/threshold : 1;
  if(stock === 0) return {cls:'lvl-critical', label:'Out'};
  if(ratio <= 0.4) return {cls:'lvl-critical', label:'Critical'};
  if(ratio <= 0.75) return {cls:'lvl-low', label:'Low'};
  if(ratio < 1.1) return {cls:'lvl-medium', label:'Medium'};
  return {cls:'lvl-high', label:'High'};
}

function statusOf(p){
  if(p.stock === 0) return 'Out of Stock';
  if(p.stock < p.threshold) return 'Low Stock';
  return 'In Stock';
}

function statusPillClass(status){
  if(status === 'Out of Stock') return 'status-out';
  if(status === 'Low Stock') return 'status-low';
  return 'status-in';
}

function populateCategoryFilter(){
  const cats = [...new Set(products.map(p=>p.category))].sort();
  els.categoryFilter.innerHTML = '<option value="">All Categories</option>' +
    cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function getFiltered(){
  const q = els.search.value.trim().toLowerCase();
  const cat = els.categoryFilter.value;
  const status = els.statusFilter.value;

  let list = products.filter(p=>{
    const matchesQ = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
    const matchesCat = !cat || p.category === cat;
    const matchesStatus = !status || statusOf(p) === status;
    return matchesQ && matchesCat && matchesStatus;
  });

  if(sortKey){
    list = list.slice().sort((a,b)=>{
      let av, bv;
      if(sortKey === 'status'){ av = statusOf(a); bv = statusOf(b); }
      else { av = a[sortKey]; bv = b[sortKey]; }
      if(typeof av === 'string') return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });
  }
  return list;
}

function renderStats(){
  const total = products.length;
  const active = products.filter(p=>p.stock > 0).length;
  const low = products.filter(p=>statusOf(p)==='Low Stock').length;
  const out = products.filter(p=>statusOf(p)==='Out of Stock').length;
  const value = products.reduce((sum,p)=>sum + p.stock*p.price, 0);

  document.getElementById('statTotal').textContent = total.toLocaleString('en-IN');
  document.getElementById('statActive').textContent = active.toLocaleString('en-IN');
  document.getElementById('statLow').textContent = low;
  document.getElementById('statOut').textContent = out;
  document.getElementById('statValue').textContent = fmtRs(value);
}

function renderTable(){
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage-1)*pageSize;
  const pageItems = filtered.slice(start, start+pageSize);

  if(pageItems.length === 0){
    els.body.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;opacity:0.4"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>No products match your filters.</div></td></tr>`;
  } else {
    els.body.innerHTML = pageItems.map(p=>{
      const lv = levelClass(p.stock, p.threshold);
      const status = statusOf(p);
      return `
      <tr data-id="${p.id}">
        <td>
          <div class="prod-cell">
            <div class="prod-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;opacity:0.45"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
            <div>
              <div class="prod-name">${escapeHtml(p.name)}</div>
              <div class="prod-sub">${escapeHtml(p.sub)}</div>
            </div>
          </div>
        </td>
        <td class="cat-text">${escapeHtml(p.category)}</td>
        <td class="sku-text">${escapeHtml(p.sku)}</td>
        <td>
          <div class="stock-cell ${lv.cls}">
            <span class="level-dot"></span>
            <div>
              <span class="stock-num">${p.stock} units</span>
              <span class="stock-sub">${lv.label}</span>
            </div>
          </div>
        </td>
        <td class="price-text">${fmtRs(p.price)}</td>
        <td><span class="status-pill ${statusPillClass(status)}">${status}</span></td>
        <td>
          <div class="row-actions">
            <button class="edit-btn" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
            <button class="menu-btn" title="More"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  els.resultsCount.textContent = `Showing ${pageItems.length} of ${filtered.length} products`;
  renderPager(totalPages);
}

function renderPager(totalPages){
  let html = `<button ${currentPage===1?'disabled':''} data-p="prev">‹</button>`;
  for(let i=1;i<=totalPages;i++){
    if(totalPages > 7 && Math.abs(i-currentPage) > 2 && i!==1 && i!==totalPages){
      if(i === 2 || i === totalPages-1) html += `<span style="padding:0 4px;color:var(--text-400)">…</span>`;
      continue;
    }
    html += `<button class="${i===currentPage?'active':''}" data-p="${i}">${i}</button>`;
  }
  html += `<button ${currentPage===totalPages?'disabled':''} data-p="next">›</button>`;
  els.pager.innerHTML = html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showToast(msg){
  els.toastMsg.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>els.toast.classList.remove('show'), 2200);
}

/* ---------- DATA LAYER (talks to api/products.php) ---------- */

const API_URL = 'api/products.php';

// products.php (the page wrapper) injects window.STOCKSMART_USER, which now
// includes a `csrf` field (see auth.php's auth_user()). Every POST/PUT/DELETE
// must send it back via the X-CSRF-Token header or api/_bootstrap.php will
// reject the request with a 419.
const CSRF_TOKEN = (window.STOCKSMART_USER && window.STOCKSMART_USER.csrf) || '';

async function loadProducts(){
  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('Failed to load products');
    products = await res.json();
  } catch(err){
    showToast('Could not load products from server');
    console.error(err);
    products = [];
  }
}

async function createProduct(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'X-CSRF-Token': CSRF_TOKEN},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Failed to create product');
  return data;
}

async function updateProduct(id, payload){
  const res = await fetch(`${API_URL}?id=${id}`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json', 'X-CSRF-Token': CSRF_TOKEN},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Failed to update product');
  return data;
}

async function deleteProductRequest(id){
  const res = await fetch(`${API_URL}?id=${id}`, {
    method: 'DELETE',
    headers: {'X-CSRF-Token': CSRF_TOKEN}
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Failed to delete product');
  return data;
}

function refreshAll(){
  populateCategoryFilter();
  renderStats();
  renderTable();
}

async function refreshFromServer(){
  await loadProducts();
  refreshAll();
}

/* ---------- EVENTS ---------- */

els.search.addEventListener('input', ()=>{ currentPage=1; renderTable(); });
els.categoryFilter.addEventListener('change', ()=>{ currentPage=1; renderTable(); });
els.statusFilter.addEventListener('change', ()=>{ currentPage=1; renderTable(); });

document.querySelectorAll('thead th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t=>t.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.arrow').textContent= sortDir === 1 ? '↑' : '↓';
    renderTable();
  });
});

els.pager.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn || btn.disabled) return;
  const p = btn.dataset.p;
  const totalPages = Math.max(1, Math.ceil(getFiltered().length / pageSize));
  if(p === 'prev') currentPage = Math.max(1, currentPage-1);
  else if(p === 'next') currentPage = Math.min(totalPages, currentPage+1);
  else currentPage = Number(p);
  renderTable();
});

els.body.addEventListener('click', async e=>{
  const row = e.target.closest('tr[data-id]');
  if(!row) return;
  const id = Number(row.dataset.id);
  if(e.target.closest('.edit-btn')){
    openModal(id);
  } else if(e.target.closest('.menu-btn')){
    if(confirm('Delete this product?')){
      try{
        await deleteProductRequest(id);
        showToast('Product deleted');
        await refreshFromServer();
      } catch(err){
        showToast(err.message);
      }
    }
  }
});

/* ---------- MODAL ---------- */

const overlay = els.overlay;
function openModal(id=null){
  editingId = id;
  if(id){
    const p = products.find(x=>x.id===id);
    els.modalTitle.textContent = 'Edit Product';
    document.getElementById('fName').value = p.name;
    document.getElementById('fCategory').value = p.category;
    document.getElementById('fSku').value = p.sku;
    document.getElementById('fBarcode').value = p.barcode || '';
    document.getElementById('fStock').value = p.stock;
    document.getElementById('fPrice').value = p.price;
  } else {
    els.modalTitle.textContent = 'Add Product';
    ['fName','fCategory','fSku','fBarcode','fStock','fPrice'].forEach(id=>document.getElementById(id).value='');
  }
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); }

document.getElementById('addProductBtn').addEventListener('click', ()=>openModal());
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target === overlay) closeModal(); });

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCategory').value.trim();
  const sku = document.getElementById('fSku').value.trim();
  const barcode = document.getElementById('fBarcode').value.trim();
  const stock = Number(document.getElementById('fStock').value) || 0;
  const price = Number(document.getElementById('fPrice').value) || 0;

  if(!name || !category || !sku){
    showToast('Please fill in all required fields');
    return;
  }

  const payload = {name, category, sku, barcode, stock, price};

  try{
    if(editingId){
      await updateProduct(editingId, payload);
      showToast('Product updated');
    } else {
      await createProduct(payload);
      showToast('Product added');
    }
    closeModal();
    await refreshFromServer();
  } catch(err){
    showToast(err.message);
  }
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeModal();
});

/* Account/profile chip and the notification bell are now handled centrally
   by assets/js/nav-guard.js (fillUserChip/fillProfileCard/initNotifBell)
   against the shared topbar and sidebar markup every page renders. */

/* ---------- Topbar search: mirrors the real filter input, supports ?search= deep links ---------- */
(function initTopSearch(){
  const topSearch = document.getElementById('topSearchInput');
  const realSearch = els.search; // the toolbar's #searchInput, already wired to renderTable()

  topSearch.addEventListener('input', () => {
    realSearch.value = topSearch.value;
    currentPage = 1;
    renderTable();
  });

  const params = new URLSearchParams(window.location.search);
  const q = params.get('search');
  if (q) {
    topSearch.value = q;
    realSearch.value = q;
    currentPage = 1;
    renderTable();
  }
})();

/* ---------- INIT ---------- */
refreshFromServer();
